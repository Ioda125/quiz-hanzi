<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz de caractères chinois</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@400;500;700&family=Ma+Shan+Zheng&family=Work+Sans:wght@400;500;600;700&family=Lora:wght@400;500;600;700&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);

    --font-ui: "Work Sans", "Noto Sans KR", -apple-system, sans-serif;
    --font-zh: "Noto Serif SC", serif;
    --zh-w: 700;
    --bg: #EDE6D6;
    --bg-elevated: #F8F4EA;
    --ink: #2B2A28;
    --ink-soft: #6b665c;
    --primary: var(--accent-seal);
    --accent-seal: #A63D2F;
    --accent-seal-soft: rgba(166,61,47,0.12);
    --accent-gold: #9C7A2E;
    --accent-gold-soft: rgba(156,122,46,0.14);
    --accent-jade: #43593B;
    --border: rgba(43,42,40,0.16);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1B1A17;
      --bg-elevated: #242220;
      --ink: #EDE6D6;
      --ink-soft: #b3ac9c;
      --accent-seal: #D3594A;
      --accent-seal-soft: rgba(211,89,74,0.16);
      --accent-gold: #D4AF5A;
      --accent-gold-soft: rgba(212,175,90,0.16);
      --accent-jade: #7C9C71;
      --border: rgba(237,230,214,0.16);
    }
  }
  :root[data-theme="dark"] {
    --bg: #1B1A17;
    --bg-elevated: #242220;
    --ink: #EDE6D6;
    --ink-soft: #b3ac9c;
    --accent-seal: #D3594A;
    --accent-seal-soft: rgba(211,89,74,0.16);
    --accent-gold: #D4AF5A;
    --accent-gold-soft: rgba(212,175,90,0.16);
    --accent-jade: #7C9C71;
    --border: rgba(237,230,214,0.16);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-ui);
    min-height: 100%;
    line-height: 1.5;
  }
  .wrap {
    max-width: 1080px;
    margin: 0 auto;
    padding: 32px 24px calc(48px + env(safe-area-inset-bottom, 0px));
  }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    padding-bottom: 22px;
    margin-bottom: 28px;
    border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: baseline; gap: 14px; }
  .brand-glyph {
    font-family: var(--font-zh);
    font-size: 2.6rem;
    font-weight: 700;
    color: var(--primary);
    line-height: 1;
  }
  .brand-text h1 { margin: 0; font-size: 1.3rem; font-weight: 600; }
  .brand-text p { margin: 2px 0 0; color: var(--ink-soft); font-size: 0.88rem; }
  .theme-btn {
    border: 1px solid var(--border);
    background: var(--bg-elevated);
    color: var(--ink-soft);
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 0.82rem;
    font-family: inherit;
    cursor: pointer;
  }
  .theme-btn:hover { color: var(--ink); border-color: var(--ink-soft); }

  .layout {
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 28px;
    align-items: start;
  }
  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; }
    .panel { order: 2; }
    .stage-col { order: 1; }
  }

  h2.section-title {
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--ink-soft);
    margin: 0 0 12px;
    letter-spacing: 0.03em;
  }

  .panel {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 20px;
  }
  .head-btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .profile-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .profile-btn {
    font-family: inherit;
    font-size: 0.84rem;
    padding: 6px 13px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--ink);
    cursor: pointer;
  }
  .profile-btn:hover { border-color: var(--ink-soft); }
  .profile-btn.active { background: var(--primary); border-color: var(--primary); color: #F8F4EA; }
  .legacy-box {
    margin-top: 12px;
    padding: 10px 12px;
    border: 1px dashed var(--accent-gold);
    border-radius: 4px;
    font-size: 0.8rem;
    color: var(--ink-soft);
  }
  .legacy-box .btn-row { margin-top: 8px; flex-wrap: wrap; }
  .divider { border: none; border-top: 1px dashed var(--border); margin: 18px 0; }

  .btn {
    font-family: inherit;
    font-size: 0.86rem;
    font-weight: 500;
    padding: 9px 16px;
    border-radius: 4px;
    border: 1px solid var(--primary);
    background: var(--primary);
    color: #F8F4EA;
    cursor: pointer;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn.secondary { background: transparent; color: var(--ink); border-color: var(--border); }
  .btn.secondary:hover { border-color: var(--ink-soft); }
  .btn.small { padding: 4px 10px; font-size: 0.76rem; }
  button:focus-visible, input:focus-visible {
    outline: 2px solid var(--primary);
    outline-offset: 1px;
  }
  .btn-row { display: flex; gap: 8px; margin-top: 10px; }

  /* rows with checkbox */
  .overview-row {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 0.84rem;
    padding: 4px 0;
  }
  .overview-row label { flex: 1; display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .overview-row input[type="checkbox"] {
    width: 15px; height: 15px;
    accent-color: var(--primary);
    cursor: pointer;
  }
  .overview-row .ov-count {
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
    font-size: 0.78rem;
  }
  .overview-bar {
    height: 8px;
    border-radius: 4px;
    background: var(--border);
    overflow: hidden;
    display: flex;
    margin-bottom: 14px;
  }
  .overview-bar span { height: 100%; }
  .overview-hint { font-size: 0.76rem; color: var(--ink-soft); margin: 8px 0 0; }

  .level-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .level-dot.lv-new { background: var(--border); box-shadow: inset 0 0 0 1px var(--ink-soft); }
  .level-dot.lv-unknown { background: var(--accent-seal); }
  .level-dot.lv-half { background: var(--accent-gold); }
  .level-dot.lv-known { background: var(--accent-jade); }

  .char-list {
    list-style: none;
    margin: 0;
    padding: 0;
    max-height: 300px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .char-list li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 9px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--bg);
    font-size: 0.82rem;
  }
  .char-list .cl-char {
    font-family: var(--font-zh);
    font-size: 1.15rem;
    color: var(--primary);
    min-width: 26px;
  }
  .char-list .cl-meta { flex: 1; color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .empty-note { color: var(--ink-soft); font-size: 0.82rem; padding: 6px 2px; }

  .stat-line {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 0.8rem; color: var(--ink-soft);
    margin-top: 14px;
  }

  /* stage */
  .stage {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 6px;
    min-height: 440px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
    position: relative;
    text-align: center;
  }
  .stage-empty { color: var(--ink-soft); max-width: 320px; }
  .stage-empty .seal { font-family: var(--font-zh); font-size: 3rem; color: var(--accent-seal); opacity: 0.5; margin-bottom: 12px; }
  .card-index { position: absolute; top: 18px; left: 22px; font-size: 0.78rem; color: var(--ink-soft); }
  .score-badge { position: absolute; top: 18px; right: 22px; font-size: 0.78rem; color: var(--ink-soft); display: flex; gap: 10px; }
  .score-badge span.ok { color: var(--accent-jade); }
  .score-badge span.half { color: var(--accent-gold); }
  .score-badge span.ko { color: var(--accent-seal); }

  .hanzi-display {
    font-family: var(--font-zh);
    font-weight: var(--zh-w);
    font-size: clamp(4.5rem, 14vw, 7.5rem);
    line-height: 1.1;
    color: var(--ink);
    margin-bottom: 30px;
    word-break: keep-all;
  }
  .stage.read .hanzi-display { font-size: clamp(1.5rem, 4.2vw, 2.2rem); line-height: 1.55; margin-bottom: 26px; padding: 0 6px; word-break: normal; }
  .stage.read .answer-block { min-height: 110px; }
  .stage.read .pinyin { font-size: 1.05rem; font-weight: 500; line-height: 1.45; }
  .stage.read .meaning { font-size: 1.05rem; margin-top: 6px; }
  .answer-block { min-height: 74px; margin-bottom: 22px; }
  .answer-hidden { color: var(--ink-soft); font-size: 0.88rem; }
  .answer-revealed { opacity: 0; animation: settle 0.35s ease forwards; }
  @keyframes settle { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  @media (prefers-reduced-motion: reduce) { .answer-revealed { animation: none; opacity: 1; } }
  .pinyin { font-size: 1.5rem; color: var(--accent-gold); font-weight: 600; margin-bottom: 4px; }
  .meaning { font-size: 1.05rem; color: var(--ink); }

  .stage-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .btn.big { padding: 12px 20px; font-size: 0.92rem; }
  .btn.jade { background: var(--accent-jade); border-color: var(--accent-jade); }
  .btn.outline-seal { background: transparent; color: var(--accent-seal); border-color: var(--accent-seal); }
  .btn.outline-seal:hover { background: var(--accent-seal-soft); }
  .btn.outline-gold { background: transparent; color: var(--accent-gold); border-color: var(--accent-gold); }
  .btn.outline-gold:hover { background: var(--accent-gold-soft); }
  .hint { font-size: 0.78rem; color: var(--ink-soft); margin-top: 18px; }

  /* ---------- Préparation / résultats du test ---------- */

  /* palettes */
  :root[data-palette="papier"][data-theme="light"] { --bg:#F3F3F1; --bg-elevated:#FFFFFF; --ink:#232323; --ink-soft:#6a6a6a; --border:rgba(0,0,0,0.14); }
  :root[data-palette="papier"][data-theme="dark"] { --bg:#121212; --bg-elevated:#1d1d1d; --ink:#EEEEEE; --ink-soft:#a8a8a8; --border:rgba(255,255,255,0.15); }
  :root[data-palette="bambou"][data-theme="light"] { --bg:#E3EADB; --bg-elevated:#F3F7EE; --ink:#24301E; --ink-soft:#5c6a53; --border:rgba(36,48,30,0.16); }
  :root[data-palette="bambou"][data-theme="dark"] { --bg:#131A12; --bg-elevated:#1C251A; --ink:#E2EADB; --ink-soft:#a5b39e; --border:rgba(226,234,219,0.16); }
  :root[data-palette="ocean"][data-theme="light"] { --bg:#DCE5EB; --bg-elevated:#EEF3F6; --ink:#1C2932; --ink-soft:#55646E; --border:rgba(28,41,50,0.16); }
  :root[data-palette="ocean"][data-theme="dark"] { --bg:#0F1720; --bg-elevated:#17222C; --ink:#DCE7EE; --ink-soft:#9EAFBB; --border:rgba(220,231,238,0.16); }

  /* thèmes à fond noir (toujours en mode sombre) */
  :root[data-palette^="noir"][data-theme="dark"] { --bg:#000000; --bg-elevated:#0C0C0C; --ink:#ECECEC; --ink-soft:#9A9A9A; --border:rgba(255,255,255,0.14); }
  :root[data-palette="noir-bleu"][data-theme="dark"] { --bg:#02050B; --bg-elevated:#0A111C; --primary:#4F8FE0; --border:rgba(160,190,230,0.18); }
  :root[data-palette="noir-or"][data-theme="dark"] { --bg:#050402; --bg-elevated:#12100A; --primary:#D4AF5A; --border:rgba(212,175,90,0.2); }
  :root[data-palette="noir-jade"][data-theme="dark"] { --bg:#010503; --bg-elevated:#09120D; --primary:#5FB58A; --border:rgba(120,200,160,0.18); }
  :root[data-palette="noir-or"][data-theme="dark"] .btn, :root[data-palette="noir-or"][data-theme="dark"] .tab-btn.active, :root[data-palette="noir-or"][data-theme="dark"] .len-btn.active, :root[data-palette="noir-or"][data-theme="dark"] .step-num { color: #1a1405; }
  :root[data-palette="noir-bleu"][data-theme="dark"] .btn, :root[data-palette="noir-bleu"][data-theme="dark"] .tab-btn.active, :root[data-palette="noir-bleu"][data-theme="dark"] .len-btn.active, :root[data-palette="noir-bleu"][data-theme="dark"] .step-num { color: #04101f; }
  :root[data-palette="noir-jade"][data-theme="dark"] .btn, :root[data-palette="noir-jade"][data-theme="dark"] .tab-btn.active, :root[data-palette="noir-jade"][data-theme="dark"] .len-btn.active, :root[data-palette="noir-jade"][data-theme="dark"] .step-num { color: #03150c; }
  .set-note { font-size: .78rem; color: var(--ink-soft); margin-top: 6px; }
  body { transition: background .3s, color .3s; }

  /* réglages */
  .set-btn { gap: 6px; }
  .set-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: flex-start; justify-content: center; padding: 6vh 14px 14px; z-index: 50; overflow-y: auto; }
  .set-card { width: 100%; max-width: 520px; background: var(--bg-elevated); color: var(--ink); border: 1px solid var(--border); border-radius: 16px; padding: 22px 24px 20px; box-shadow: 0 18px 50px rgba(0,0,0,0.28); }
  .set-card h3 { margin: 0 0 14px; font-size: 1.15rem; }
  .set-row { margin: 0 0 16px; }
  .set-row .lbl { font-size: .74rem; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 7px; }
  .set-opts { display: flex; flex-wrap: wrap; gap: 8px; }
  .set-opts .len-btn { padding: 6px 14px; font-size: .86rem; }
  .sw { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--border); cursor: pointer; padding: 0; transition: transform .15s; position: relative; overflow: hidden; }
  .sw:hover { transform: scale(1.1); }
  .sw.active { border-color: var(--primary); box-shadow: 0 0 0 2px var(--bg-elevated), 0 0 0 4px var(--primary); }
  .sw i { position: absolute; right: 0; bottom: 0; width: 50%; height: 50%; }
  .set-preview { display: flex; align-items: baseline; gap: 16px; padding: 12px 14px; border: 1px dashed var(--border); border-radius: 10px; margin-bottom: 16px; }
  .set-preview .big { font-family: var(--font-zh); font-weight: var(--zh-w); font-size: 2.4rem; color: var(--primary); line-height: 1; }
  .set-foot { display: flex; justify-content: flex-end; }
  html[data-size="sm"] { font-size: 14.5px; } html[data-size="lg"] { font-size: 18px; }

  /* animations */
  @keyframes popIn { 0% { transform: scale(.94); } 55% { transform: scale(1.04); } 100% { transform: scale(1); } }
  @keyframes okPop { 0% { transform: scale(1); } 45% { transform: scale(1.06); } 100% { transform: scale(1); } }
  @keyframes overlayIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes cardIn { from { opacity: 0; transform: translateY(14px) scale(.97); } to { opacity: 1; transform: none; } }
  @keyframes barGrow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  .btn, .len-btn, .tab-btn, .theme-btn { transition: transform .12s, box-shadow .18s, background .18s, border-color .18s, color .18s, opacity .18s; }
  .btn:not(:disabled):hover, .len-btn:hover, .tab-btn:hover, .theme-btn:hover { transform: translateY(-1px); }
  .btn:not(:disabled):active, .len-btn:active, .tab-btn:active, .theme-btn:active, .exo-cell:active { transform: scale(.96); }
  .btn.big:not(:disabled):hover { box-shadow: 0 6px 16px rgba(0,0,0,0.16); }
  .overview-bar span, .wbar span, .team-bar span { transform-origin: left center; animation: barGrow .6s cubic-bezier(.2,.7,.2,1) both; }
  .exo-cell.pop { animation: popIn .22s ease-out; }
  .exo-cell.ok { animation: okPop .5s ease-out both; animation-delay: var(--d, 0ms); }
  .exo-cell.ko { animation: fxShake .5s ease-out both; animation-delay: var(--d, 0ms); }
  .exo-choices .exo-cell { animation: fxRise .28s ease-out both; animation-delay: calc(var(--i, 0) * 28ms); }
  .exo-prompt { animation: fxReveal .3s ease-out both; }
  .exo-score { animation: popIn .5s ease-out both; transform-origin: left center; }
  .exo-recap li { animation: fxRise .35s ease-out both; animation-delay: calc(var(--i, 0) * 55ms + 150ms); }
  .set-overlay { animation: overlayIn .18s ease-out; }
  .set-card { animation: cardIn .26s cubic-bezier(.2,.8,.3,1); }
  .stats-table tbody tr { animation: fxRise .3s ease-out both; animation-delay: calc(var(--i, 0) * 12ms); }
  html[data-anim="off"] *, html[data-anim="off"] *::before, html[data-anim="off"] *::after { animation: none !important; transition: none !important; }
  @media (prefers-reduced-motion: reduce) { .overview-bar span, .wbar span, .team-bar span, .exo-cell, .exo-prompt, .exo-score, .exo-recap li, .set-overlay, .set-card, .stats-table tbody tr { animation: none !important; } }
  .tabs { display: flex; gap: 8px; margin: 0 0 16px; }
  .tab-btn { font-family: inherit; font-size: .95rem; padding: 8px 20px; border-radius: 999px; border: 1px solid var(--border); background: transparent; color: var(--ink); cursor: pointer; }
  .tab-btn:hover { border-color: var(--ink-soft); }
  .tab-btn.active { background: var(--primary); border-color: var(--primary); color: #F8F4EA; }
  .stats-view { background: var(--card, var(--panel, transparent)); }
  .stats-box { border: 1px solid var(--border); border-radius: 14px; padding: 22px 24px; background: var(--surface, transparent); }
  .stats-box h3 { margin: 0 0 4px; }
  .stats-sum { display: flex; flex-wrap: wrap; gap: 10px 28px; margin: 14px 0 18px; }
  .stats-sum b { display: block; font-size: 1.5rem; }
  .stats-sum span { color: var(--ink-soft); font-size: .85rem; }
  .stats-chap { font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); margin: 20px 0 6px; }
  .stats-table { width: 100%; border-collapse: collapse; font-size: .92rem; }
  .stats-table th { text-align: right; font-weight: 500; color: var(--ink-soft); font-size: .78rem; padding: 4px 8px; }
  .stats-table th:first-child, .stats-table td:first-child { text-align: left; }
  .stats-table td { padding: 7px 8px; border-top: 1px solid var(--border); text-align: right; font-variant-numeric: tabular-nums; }
  .stats-table .zh3 { font-family: var(--font-zh); font-size: 1.25rem; margin-right: 8px; }
  .stats-table .sm { color: var(--ink-soft); font-size: .82rem; }
  .stats-table .c-k { color: var(--accent-jade); } .stats-table .c-h { color: var(--accent-gold); } .stats-table .c-u { color: var(--accent-seal); }
  .wbar { display: flex; width: 110px; height: 9px; border-radius: 5px; overflow: hidden; background: var(--border); margin-left: auto; }
  .wbar span { display: block; height: 100%; }
  .stats-table td.bar-cell { width: 150px; }
  .stats-table .pc { display: block; font-size: .72rem; color: var(--ink-soft); margin-top: 3px; }
  .stats-table .zero { opacity: .35; }
  .exo { width: 100%; text-align: left; }
  .exo h3 { margin: 0 0 4px; }
  .exo-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 28px; margin: 16px 0; }
  .exo-col { display: flex; flex-direction: column; gap: 8px; }
  .exo-cell { font-family: inherit; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 14px; border-radius: 10px; border: 2px solid var(--border); background: transparent; color: var(--ink); cursor: pointer; min-height: 52px; transition: border-color .12s, background .12s, transform .12s; }
  .exo-cell:hover { border-color: var(--ink-soft); }
  .exo-cell.sel { border-color: var(--accent-gold); transform: scale(1.02); }
  .exo-cell.linked { border-color: var(--pc); background: color-mix(in srgb, var(--pc) 16%, transparent); }
  .exo-cell.ok { border-color: var(--accent-jade); background: color-mix(in srgb, var(--accent-jade) 18%, transparent); }
  .exo-cell.ko { border-color: var(--accent-seal); background: color-mix(in srgb, var(--accent-seal) 14%, transparent); }
  .exo-cell.zh { font-family: var(--font-zh); font-size: 1.6rem; justify-content: center; }

What is his mobile number, do you know?", "Yes, the number is: 13261231948.", "Thank you!", "You're welcome.", "Today is Friday, what are you all doing this weekend?", "When I have nothing to do, I go online in my dorm.", "I study drawing at a school.", "Do you study traditional Chinese painting?", "Yes, I like Chinese painting. What do you do on weekends?", "Generally I read at home, listen to music, and sometimes I go to the supermarket to shop.", "My roommate and I tidy up the room together, and eat and chat together."], "ko": ["안녕하세요!", "안녕하세요! (존댓말)", "좋은 아침이에요!", "어느 나라 사람이에요?", "저는 미국 사람이에요. 당신은요?", "저는 한국 사람이에요.", "그는요?", "그는 일본 사람이에요.", "안녕하세요! 실례지만 이름이 뭐예요?", "저는 린나예요. 당신은요?", "저는 야마다 유예요. 성은 야마다예요.", "만나서 반갑습니다.", "저도 만나서 정말 반갑습니다.", "선생님, 성함이 어떻게 되세요?", "저는 이 씨예요.", "이 선생님, 안녕하세요!", "안녕하세요! 이름이 뭐예요?", "저는 마르탱이에요.", "린나는 프랑스 유학생이고 중국어를 공부해요.", "아밍은 태국 유학생이고 그도 중국어를 공부해요.", "그들은 함께 수업을 듣고 함께 중국어로 말해요.", "안녕하세요! 저는 중국 사람이고 주윈이라고 해요. 이름이 뭐예요?", "저는 린나예요.", "저는 프랑스 사람이에요.", "무엇을 공부해요?", "저는 중국어를 공부해요. 당신은요?", "저는 영어를 공부해요.", "프랑스어를 공부해요?", "저는 프랑스어를 공부하지 않아요.", "린나, 그는 누구예요?", "그는 제 반 친구예요.", "그는 어느 나라 사람이에요?", "그는 태국 사람이에요.", "그도 중국어를 공부해요?", "그도 중국어를 공부해요.", "저는 린나이고 프랑스 유학생이에요.", "우리 가족은 네 명이에요: 아빠, 엄마, 오빠와 저예요.", "우리 아빠는 사무직원이고, 엄마는 선생님이며, 오빠와 저는 둘 다 대학생이에요.", "당신 가족은 몇 명이에요?", "우리 가족은 세 명이에요.", "가족이 어떻게 되세요?", "우리 가족은 아빠, 엄마와 저예요.", "아빠와 엄마는 무슨 일을 하세요?", "아빠는 변호사이고 엄마는 의사예요.", "린나, 너희 반에는 학생이 몇 명 있어?", "열여섯 명이에요.", "너희 반에는 프랑스 사람이 몇 명 있어?", "우리 반에는 프랑스 사람이 두 명 있어요.", "너희 반에 한국 사람이 있어?", "네, 있어요.", "한국 사람이 몇 명 있어?", "한국 사람이 네 명 있어요.", "마르탱은 전자사전과 컴퓨터를 사고 싶어 해요.", "전자사전 한 대에 780위안, 컴퓨터 한 대에 5,900위안이라서 모두 6,680위안이 필요해요.", "안녕하세요! 실례지만 무엇이 필요하세요?", "빵 하나 주세요.", "어떤 종류를 원하세요?", "이걸로 주세요. 이건 하나에 얼마예요?", "이건 하나에 4.5위안이에요.", "두 개 주세요.", "모두 9위안이에요.", "감사합니다!", "천만에요!", "실례지만, 바나나는 한 근에 얼마예요?", "한 근에 1.8위안이에요.", "사과는요?", "한 근에 3.5위안이에요. 얼마나 사시겠어요?", "바나나 네 근(2kg)과 사과 세 근(1.5kg)을 살게요. 모두 얼마예요?", "모두 17.7위안이에요.", "여기는 제1강의동이고, 우리는 여기에 있어요.", "도서관은 제1강의동 북쪽에 있고, 운동장과 체육관은 제1강의동 서쪽에 있어요.", "여기는 유학생 기숙사예요. 운동장 남쪽에 있고, 서쪽에는 식당 하나와 슈퍼마켓도 있어요.", "야마다, 어디 가요?", "저는 슈퍼마켓에 가요.", "중국은행이 어디에 있어요? 알아요?", "알아요, 슈퍼마켓 동쪽에 있어요. 제가 같이 갈게요.", "정말 잘됐네요!", "실례지만, 화장실이 어디에 있어요?", "죄송해요, 저는 몰라요.", "괜찮아요. 실례지만, 화장실이 어디에 있는지 아세요?", "가게 안에 있어요.", "가게가 어디에 있어요?", "앞쪽에 있어요. 보세요, 바로 저기예요.", "천만에요.", "오늘은 9월 28일 화요일이고 린나의 생일이에요.", "수업이 끝난 후에 친구들은 함께 그녀에게 밥을 사 주려고 해요.", "린나, 오늘 네 생일 맞지?", "내 생일? 오늘 며칠이야?", "오늘은 9월 28일이야.", "맞아, 맞아, 오늘이 내 생일이야.", "우리가 밥 살게, 어때?", "너무 좋아! 고마워, 모두!", "린나, 생일 축하해! 이건 우리의 선물이야.", "고마워. 무슨 선물이야?", "중국어 책 한 권과 펜 한 자루야.", "10월 10일이 내 생일이야. 다들 우리 집에 와, 어때?", "좋아! 10월 10일은 무슨 요일이야?", "일요일이야.", "시간 있어, 문제없어.", "저는 유학생이에요. 저는 매일 6시 반에 일어나고, 일어난 후 먼저 샤워를 한 다음 아침을 먹어요.", "저는 8시 15분 전에 교실에 수업하러 가요.", "우리는 매일 8시에 수업을 시작해서 11시 반에 끝나요.", "오후에는 자주 도서관에 가서 책을 읽어요.", "저녁에는 중국어를 공부하고, 가끔 텔레비전을 보거나 인터넷을 해요.", "지금 몇 시예요?", "1시 40분이에요. 무슨 일 있어요?", "저는 2시에 도서관에 가서 책을 읽어요.", "무슨 책을 읽어요?", "저는 영어 책을 읽어요.", "도서관은 매일 몇 시에 문을 열어요?", "아침 8시에 문을 열어요.", "몇 시에 문을 닫아요?", "저녁 8시에 문을 닫아요.", "좋아요, 내일 저도 갈게요.", "야마다, 나 추이하오야. 오늘 무슨 계획 있어?", "오전 9시에 중국 친구와 만나고, 오후에는 시간이 있어. 너는 무슨 일 있어?", "너를 초대해서 중국 영화를 보고 싶어.", "좋아. 영화는 몇 시에 시작해?", "오후 2시 반에 시작해. 우리 2시 15분에 가자.", "좋아. 안녕!", "이 도시 서쪽에는 시산공원이라는 공원이 있어요.", "그곳에는 산도 있고, 물도 있고, 나무도 있고, 꽃도 있어서 경치가 아주 아름답고 공기도 아주 신선해요.", "매일 많은 사람이 그곳에 가서 등산을 하고, 경치를 보고, 신선한 공기를 마셔요.", "이번 일요일에 우리도 등산하러 가요.", "이번 일요일에 바빠요?", "바쁘지 않아요.", "일요일에 우리 등산하러 가는데, 갈래요?", "어디로 등산하러 가요?", "시산에 가요.", "시산이 아주 아름답다고 들었어요. 저도 같이 가고 싶어요.", "좋아요. 우리는 아침 8시에 출발해요.", "7시 반에 당신을 데리러 갈게요.", "다들 피곤해요?", "저도 피곤해요. 우리 좀 쉬어요.", "제 룸메이트는 중국 사람이고 자동차 회사에서 일해요.", "그는 매일 아주 바빠요. 아침 8시부터 오후 5시까지 회사에서 일하고, 가끔 주말에도 출근해요.", "평소에 저는 학교 식당에서 밥을 먹고, 그도 집에서 밥을 먹지 않아요.", "쉴 때는 우리가 집에서 요리를 해요.", "저는 한국 음식을 만들고, 그는 중국 음식을 만들며, 우리는 함께 밥을 먹고 이야기해요.", "안녕하세요! 실례지만 누구를 찾으세요?", "안녕하세요! 저는 추이하오의 반 친구 야마다예요. 추이하오 있어요?", "없어요. 지금 친구 집에서 저녁을 먹고 있어요.", "그의 휴대전화 번호가 뭔지 아세요?", "알아요, 번호는 13261231948이에요.", "감사합니다!", "별말씀을요.", "오늘은 금요일인데, 다들 주말에 뭐 해요?", "할 일이 없을 때는 기숙사에서 인터넷을 해요.", "저는 한 학교에서 그림을 배워요.", "중국화를 배워요?", "네, 저는 중국화를 좋아해요. 다들 주말에 뭐 해요?", "저는 보통 집에서 책을 읽고 음악을 들으며, 가끔 슈퍼마켓에 가서 물건을 사요.", "저는 룸메이트와 함께 방을 정리하고, 함께 밥을 먹고 이야기해요."], "es": ["¡Hola!", "¡Hola! (forma cortés)", "¡Buenos días!", "¿De qué país eres?", "Soy estadounidense. ¿Y tú?", "Soy coreano (de Corea del Sur).", "¿Y él?", "Él es japonés.", "¡Hola! Perdona, ¿cómo te llamas?", "Me llamo Linna. ¿Y tú?", "Me llamo Yamada Yu, mi apellido es Yamada.", "Encantado de conocerte.", "Yo también estoy encantado de conocerte.", "Profesor, ¿cuál es su apellido?", "Mi apellido es Li.", "¡Hola, profesor Li!", "¡Hola! ¿Cómo te llamas?", "Me llamo Martín.", "Linna es una estudiante francesa; estudia chino.", "A-Ming es un estudiante tailandés; también estudia chino.", "Van juntos a clase y hablan chino juntos.", "¡Hola! Soy chino, me llamo Zhu Yun, ¿y tú cómo te llamas?", "Me llamo Linna.", "Soy francesa.", "¿Qué estudias?", "Estudio chino. ¿Y tú?", "Estudio inglés.", "¿Estudias francés?", "No estudio francés.", "Linna, ¿quién es él?", "Es mi compañero de clase.", "¿De qué país es?", "Es tailandés.", "¿Él también estudia chino?", "Él también estudia chino.", "Me llamo Linna, soy una estudiante francesa.", "Mi familia tiene cuatro miembros: papá, mamá, mi hermano mayor y yo.", "Mi padre es empleado de oficina, mi madre es profesora, y mi hermano y yo somos estudiantes universitarios.", "¿Cuántas personas hay en tu familia?", "Hay tres personas en mi familia.", "¿Quiénes hay en tu familia?", "En mi familia hay papá, mamá y yo.", "¿A qué se dedican tu padre y tu madre?", "Mi padre es abogado y mi madre es médica.", "Linna, ¿cuántos alumnos hay en vuestra clase?", "Dieciséis.", "¿Cuántos franceses hay en vuestra clase?", "En nuestra clase hay dos franceses.", "¿Hay coreanos en vuestra clase?", "Sí, hay.", "¿Cuántos coreanos hay?", "Hay cuatro coreanos.", "Martín quiere comprar un diccionario electrónico y un ordenador.", "Un diccionario electrónico cuesta 780 yuanes y un ordenador 5 900 yuanes; necesita     { id: "chap6", items: [["马丁想买电子词典和电脑。", "Mǎdīng xiǎng mǎi diànzǐ cídiǎn hé diànnǎo.", "Martin veut acheter un dictionnaire électronique et un ordinateur.", "Мартин хочет купить электронный словарь и компьютер."], ["一部电子词典七百八十块钱，一台电脑五千九百块钱，一共需要六千六百八十块钱。", "Yí bù diànzǐ cídiǎn qībǎi bāshí kuài qián, yì tái diànnǎo wǔqiān jiǔbǎi kuài qián, yígòng xūyào liùqiān liùbǎi bāshí kuài qián.", "Un dictionnaire électronique coûte 780 yuans, un ordinateur 5 900 yuans ; il faut 6 680 yuans en tout.", "Электронный словарь стоит 780 юаней, компьютер — 5900 юаней, всего нужно 6680 юаней."], ["你好！请问，你要什么？", "Nǐ hǎo! Qǐngwèn, nǐ yào shénme?", "Bonjour ! Excusez-moi, que désirez-vous ?", "Здравствуйте! Скажите, что вам нужно?"], ["我要一个面包。", "Wǒ yào yí ge miànbāo.", "Je voudrais un pain.", "Мне нужен один хлеб."], ["你要哪种？", "Nǐ yào nǎ zhǒng?", "Lequel voulez-vous ?", "Какой именно вам нужен?"], ["我要这种，这种多少钱一个？", "Wǒ yào zhè zhǒng, zhè zhǒng duōshao qián yí ge?", "Je veux celui-ci, combien coûte-t-il l'unité ?", "Мне вот этот. Сколько он стоит за штуку?"], ["这种四块五一个。", "Zhè zhǒng sì kuài wǔ yí ge.", "Celui-ci coûte 4,5 yuans pièce.", "Этот стоит 4,5 юаня за штуку."], ["我要两个。", "Wǒ yào liǎng ge.", "J'en prends deux.", "Я возьму два."], ["一共九块。", "Yígòng jiǔ kuài.", "Cela fait 9 yuans en tout.", "Всего 9 юаней."], ["谢谢！", "Xièxie!", "Merci !", "Спасибо!"], ["不客气！", "Bú kèqi!", "De rien !", "Пожалуйста! Не за что!"], ["请问，香蕉多少钱一斤？", "Qǐngwèn, xiāngjiāo duōshao qián yì jīn?", "Excusez-moi, combien coûte le demi-kilo de bananes ?", "Скажите, сколько стоят бананы за цзинь (500 г)?"], ["一块八一斤。", "Yí kuài bā yì jīn.", "1,8 yuan le demi-kilo.", "1,8 юаня за цзинь."], ["苹果呢？", "Píngguǒ ne?", "Et les pommes ?", "А яблоки?"], ["三块五一斤。您买多少？", "Sān kuài wǔ yì jīn. Nín mǎi duōshao?", "3,5 yuans le demi-kilo. Combien en voulez-vous ?", "3,5 юаня за цзинь. Сколько вам взять?"], ["我买四斤香蕉，再买三斤苹果。一共多少钱？", "Wǒ mǎi sì jīn xiāngjiāo, zài mǎi sān jīn píngguǒ. Yígòng duōshao qián?", "J'achète 2 kg de bananes (4 jin) et 1,5 kg de pommes (3 jin). Combien en tout ?", "Я куплю 4 цзиня бананов и ещё 3 цзиня яблок. Сколько всего?"], ["一共十七块七（毛）。", "Yígòng shíqī kuài qī (máo).", "17,7 yuans en tout.", "Всего 17,7 юаня."]] },
    { id: "chap7", items: [["这是教学一楼，我们在这儿。", "Zhè shì jiàoxué yī lóu, wǒmen zài zhèr.", "Voici le bâtiment d'enseignement n°1, nous sommes ici.", "Это первый учебный корпус, мы находимся здесь."], ["图书馆在教学一楼北边，运动场和体育馆在教学一楼西边。", "Túshūguǎn zài jiàoxué yī lóu běibian, yùndòngchǎng hé tǐyùguǎn zài jiàoxué yī lóu xībian.", "La bibliothèque est au nord du bâtiment n°1 ; le terrain de sport et le gymnase sont à l'ouest.", "Библиотека находится к северу от первого учебного корпуса, а стадион и спортзал — к западу."], ["这是留学生楼，留学生楼在运动场南边，留学生楼西边有一个饭馆，还有一个超市。", "Zhè shì liúxuéshēng lóu, liúxuéshēng lóu zài yùndòngchǎng nánbian, liúxuéshēng lóu xībian yǒu yí ge fànguǎn, hái yǒu yí ge chāoshì.", "Voici le bâtiment des étudiants étrangers, au sud du terrain de sport ; à l'ouest il y a un restaurant et aussi un supermarché.", "Это общежитие для иностранных студентов, оно к югу от стадиона; к западу от него есть ресторан и ещё супермаркет."], ["山田，你去哪儿？", "Shāntián, nǐ qù nǎr?", "Yamada, où vas-tu ?", "Ямада, ты куда идёшь?"], ["我去超市。", "Wǒ qù chāoshì.", "Je vais au supermarché.", "Я иду в супермаркет."], ["中国银行在哪儿？你知道吗？", "Zhōngguó Yínháng zài nǎr? Nǐ zhīdào ma?", "Où est la Banque de Chine ? Tu le sais ?", "Где находится Банк Китая? Ты знаешь?"], ["知道，在超市东边。我跟你一起去吧。", "Zhīdào, zài chāoshì dōngbian. Wǒ gēn nǐ yìqǐ qù ba.", "Oui, c'est à l'est du supermarché. Je vais y aller avec toi.", "Знаю, к востоку от супермаркета. Давай я пойду с тобой."], ["太好了！", "Tài hǎo le!", "Super !", "Замечательно!"], ["请问，哪儿有卫生间？", "Qǐngwèn, nǎr yǒu wèishēngjiān?", "Excusez-moi, où y a-t-il des toilettes ?", "Скажите, где здесь туалет?"], ["对不起，我不知道。", "Duìbuqǐ, wǒ bù zhīdào.", "Désolé, je ne sais pas.", "Извините, я не знаю."], ["没关系。请问，你知道哪儿有卫生间吗？", "Méi guānxi. Qǐngwèn, nǐ zhīdào nǎr yǒu wèishēngjiān ma?", "Ce n'est pas grave. Excusez-moi, sais-tu où il y a des toilettes ?", "Ничего страшного. Скажите, вы не знаете, где здесь туалет?"], ["商店里边有。", "Shāngdiàn lǐbian yǒu.", "Il y en a dans le magasin.", "В магазине есть."], ["商店在什么地方？", "Shāngdiàn zài shénme dìfang?", "Où se trouve le magasin ?", "Где находится магазин?"], ["在前边。你看，那儿就是。", "Zài qiánbian. Nǐ kàn, nàr jiù shì.", "Devant. Regarde, c'est juste là-bas.", "Впереди. Смотри, вот он там."], ["不客气。", "Bú kèqi.", "De rien.", "Не за что."]] },
    { id: "chap8", items: [["今天九月二十八日，星期二，是林娜的生日。", "Jīntiān jiǔ yuè èrshíbā rì, xīngqī'èr, shì Línnà de shēngrì.", "Aujourd'hui nous sommes le 28 septembre, mardi, c'est l'anniversaire de Linna.", "Сегодня 28 сентября, вторник — день рождения Линны."], ["下课以后，同学们准备一起请她吃饭。", "Xià kè yǐhòu, tóngxuémen zhǔnbèi yìqǐ qǐng tā chī fàn.", "Après les cours, ses camarades comptent l'inviter ensemble à manger.", "После занятий однокурсники собираются вместе пригласить её поужинать."], ["林娜，今天是你的生日，对吗？", "Línnà, jīntiān shì nǐ de shēngrì, duì ma?", "Linna, aujourd'hui c'est ton anniversaire, n'est-ce pas ?", "Линна, сегодня твой день рождения, верно?"], ["我的生日？今天几号？", "Wǒ de shēngrì? Jīntiān jǐ hào?", "Mon anniversaire ? On est le combien aujourd'hui ?", "Мой день рождения? Какое сегодня число?"], ["今天九月二十八号。", "Jīntiān jiǔ yuè èrshíbā hào.", "Nous sommes le 28 septembre.", "Сегодня 28 сентября."], ["对，对，今天是我的生日。", "Duì, duì, jīntiān shì wǒ de shēngrì.", "Oui, oui, aujourd'hui c'est mon anniversaire.", "Да, да, сегодня мой день рождения."], ["我们请你吃饭，怎么样？", "Wǒmen qǐng nǐ chī fàn, zěnmeyàng?", "Nous t'invitons à manger, qu'en dis-tu ?", "Мы приглашаем тебя поесть, как тебе?"], ["太好了！谢谢你们！", "Tài hǎo le! Xièxie nǐmen!", "Super ! Merci à vous !", "Замечательно! Спасибо вам!"], ["林娜，祝你生日快乐！这是我们的礼物。", "Línnà, zhù nǐ shēngrì kuàilè! Zhè shì wǒmen de lǐwù.", "Linna, joyeux anniversaire ! Voici notre cadeau.", "Линна, с днём рождения! Это наш подарок."], ["谢谢。是什么礼物？", "Xièxie. Shì shénme lǐwù?", "Merci. C'est quel cadeau ?", "Спасибо. Что за подарок?"], ["一本中文书和一支笔。", "Yì běn Zhōngwén shū hé yì zhī bǐ.", "Un livre de chinois et un stylo.", "Книга по-китайски и ручка."], ["十月十号是我的生日，你们都去我家，怎么样？", "Shí yuè shí hào shì wǒ de shēngrì, nǐmen dōu qù wǒ jiā, zěnmeyàng?", "Le 10 octobre c'est mon anniversaire, venez tous chez moi, qu'en dites-vous ?", "10 октября мой день рождения, приходите все ко мне, как вам?"], ["好啊！十月十号星期几？", "Hǎo a! Shí yuè shí hào xīngqī jǐ?", "Bonne idée ! Le 10 octobre, c'est quel jour de la semaine ?", "Хорошо! Какой день недели 10 октября?"], ["星期日。", "Xīngqīrì.", "Dimanche.", "Воскресенье."], ["有时间，没问题。", "Yǒu shíjiān, méi wèntí.", "J'ai le temps, pas de problème.", "Время есть, нет проблем."]] },
    { id: "chap9", items: [["我是留学生。我每天六点半起床，起床以后先洗澡，然后吃早饭。", "Wǒ shì liúxuéshēng. Wǒ měitiān liù diǎn bàn qǐchuáng, qǐchuáng yǐhòu xiān xǐzǎo, ránhòu chī zǎofàn.", "Je suis étudiant étranger. Chaque jour je me lève à 6 h 30, après quoi je prends d'abord une douche, puis le petit-déjeuner.", "Я иностранный студент. Каждый день я встаю в полседьмого, после этого сначала принимаю душ, а потом завтракаю."], ["我差一刻八点去教室上课。", "Wǒ chà yí kè bā diǎn qù jiàoshì shàng kè.", "Je vais en classe à huit heures moins le quart.", "Без пятнадцати восемь я иду в класс на занятия."], ["我们每天八点开始上课，十一点半下课。", "Wǒmen měitiān bā diǎn kāishǐ shàng kè, shíyī diǎn bàn xià kè.", "Nous commençons les cours à 8 h chaque jour, et ils finissent à 11 h 30.", "Каждый день занятия начинаются в восемь, а заканчиваются в половине двенадцатого."], ["下午我常常去图书馆看书。", "Xiàwǔ wǒ chángcháng qù túshūguǎn kàn shū.", "L'après-midi je vais souvent lire à la bibliothèque.", "После обеда я часто хожу в библиотеку читать."], ["晚上我学习汉语，有时候看电视、上网。", "Wǎnshang wǒ xuéxí Hànyǔ, yǒushíhou kàn diànshì, shàng wǎng.", "Le soir j'étudie le chinois, et parfois je regarde la télévision ou je vais sur Internet.", "Вечером я учу китайский, а иногда смотрю телевизор и сижу в интернете."], ["现在几点？", "Xiànzài jǐ diǎn?", "Quelle heure est-il ?", "Который сейчас час?"], ["一点四十。你有事吗？", "Yī diǎn sìshí. Nǐ yǒu shì ma?", "1 h 40. Tu as quelque chose de prévu ?", "1:40. У тебя есть дела?"], ["我两点去图书馆看书。", "Wǒ liǎng diǎn qù túshūguǎn kàn shū.", "J'irai à la bibliothèque à 2 h pour lire.", "В два часа я пойду в библиотеку читать."], ["你看什么书？", "Nǐ kàn shénme shū?", "Tu lis quel livre ?", "Какую книгу ты читаешь?"], ["我看英文书。", "Wǒ kàn Yīngwén shū.", "Je lis un livre en anglais.", "Я читаю книгу на английском."], ["图书馆每天几点开门？", "Túshūguǎn měitiān jǐ diǎn kāi mén?", "À quelle heure la bibliothèque ouvre-t-elle chaque jour ?", "Во сколько библиотека открывается каждый день?"], ["早上八点开门。", "Zǎoshang bā diǎn kāi mén.", "Elle ouvre à 8 h du matin.", "Открывается в восемь утра."], ["几点关门？", "Jǐ diǎn guān mén?", "À quelle heure ferme-t-elle ?", "Во сколько закрывается?"], ["晚上八点关门。", "Wǎnshang bā diǎn guān mén.", "Elle ferme à 8 h du soir.", "Закрывается в восемь вечера."], ["太好了，明天我也去。", "Tài hǎo le, míngtiān wǒ yě qù.", "Super, j'y vais aussi demain.", "Здорово, завтра я тоже пойду."], ["山田，我是崔浩。你今天有什么安排？", "Shāntián, wǒ shì Cuī Hào. Nǐ jīntiān yǒu shénme ānpái?", "Yamada, c'est Cui Hao. Qu'as-tu de prévu aujourd'hui ?", "Ямада, это Цуй Хао. Какие у тебя планы на сегодня?"], ["上午九点我跟中国朋友见面，下午我有时间，你有什么事？", "Shàngwǔ jiǔ diǎn wǒ gēn Zhōngguó péngyou jiànmiàn, xiàwǔ wǒ yǒu shíjiān, nǐ yǒu shénme shì?", "À 9 h du matin je retrouve un ami chinois, l'après-midi j'ai du temps, et toi, tu as quelque chose ?", "В девять утра я встречаюсь с китайским другом, после обеда у меня есть время. А у тебя есть дела?"], ["我想请你看中国电影。", "Wǒ xiǎng qǐng nǐ kàn Zhōngguó diànyǐng.", "J'aimerais t'inviter à voir un film chinois.", "Я хочу пригласить тебя посмотреть китайский фильм."], ["好啊。电影几点开始？", "Hǎo a. Diànyǐng jǐ diǎn kāishǐ?", "Avec plaisir. À quelle heure commence le film ?", "Хорошо. Во сколько начинается фильм?"], ["下午两点半开始。我们两点一刻去吧。", "Xiàwǔ liǎng diǎn bàn kāishǐ. Wǒmen liǎng diǎn yí kè qù ba.", "Il commence à 14 h 30. Partons à 14 h 15.", "Начало в половине третьего. Давай пойдём в четверть третьего."], ["好。再见！", "Hǎo. Zàijiàn!", "D'accord. Au revoir !", "Хорошо. До свидания!"]] },
    { id: "chap10", items: [["这个城市西边有一个公园，叫西山公园。", "Zhège chéngshì xībian yǒu yí ge gōngyuán, jiào Xīshān Gōngyuán.", "À l'ouest de cette ville il y a un parc qui s'appelle le parc Xishan.", "К западу от этого города есть парк, который называется Сишань."], ["那里有山，有水，有树，有花，风景非常漂亮，空气也非常新鲜。", "Nàli yǒu shān, yǒu shuǐ, yǒu shù, yǒu huā, fēngjǐng fēicháng piàoliang, kōngqì yě fēicháng xīnxiān.", "Là-bas il y a des montagnes, de l'eau, des arbres, des fleurs ; le paysage est très beau et l'air très frais.", "Там есть горы, вода, деревья и цветы, пейзаж очень красивый, а воздух очень свежий."], ["每天都有很多人去那儿爬山，看风景，呼吸新鲜空气。", "Měitiān dōu yǒu hěn duō rén qù nàr pá shān, kàn fēngjǐng, hūxī xīnxiān kōngqì.", "Chaque jour beaucoup de gens y vont faire de la randonnée, admirer le paysage et respirer l'air frais.", "Каждый день много людей ходит туда в горы, смотрит на пейзажи и дышит свежим воздухом."], ["这个星期天我们也去爬山。", "Zhège xīngqītiān wǒmen yě qù pá shān.", "Ce dimanche nous allons aussi faire de la randonnée.", "В это воскресенье мы тоже пойдём в горы."], ["这个星期天你忙不忙？", "Zhège xīngqītiān nǐ máng bu máng?", "Ce dimanche, es-tu occupé ?", "Ты занят в это воскресенье?"], ["我不忙。", "Wǒ bù máng.", "Je ne suis pas occupé.", "Я не занят."], ["星期天我们去爬山，你去不去？", "Xīngqītiān wǒmen qù pá shān, nǐ qù bu qù?", "Dimanche nous allons faire de la randonnée, tu viens ?", "В воскресенье мы идём в горы, ты пойдёшь?"], ["你们去哪儿爬山？", "Nǐmen qù nǎr pá shān?", "Où allez-vous faire de la randonnée ?", "Куда вы пойдёте в горы?"], ["去西山。", "Qù Xīshān.", "À Xishan.", "На Сишань."], ["听说西山非常漂亮，我也想跟你们一起去。", "Tīngshuō Xīshān fēicháng piàoliang, wǒ yě xiǎng gēn nǐmen yìqǐ qù.", "On dit que Xishan est très beau, je voudrais aussi y aller avec vous.", "Говорят, Сишань очень красивый, я тоже хочу пойти с вами."], ["太好了。我们早上八点出发。", "Tài hǎo le. Wǒmen zǎoshang bā diǎn chūfā.", "Super. Nous partons à 8 h du matin.", "Отлично. Мы выходим в восемь утра."], ["我七点半去找你。", "Wǒ qī diǎn bàn qù zhǎo nǐ.", "Je viendrai te chercher à 7 h 30.", "Я зайду за тобой в половине восьмого."], ["大家累不累？", "Dàjiā lèi bu lèi?", "Êtes-vous fatigués ?", "Вы все устали?"], ["我也觉得很累，我们休息一下吧。", "Wǒ yě juéde hěn lèi, wǒmen xiūxi yíxià ba.", "Moi aussi je me sens fatigué, reposons-nous un peu.", "Я тоже чувствую усталость, давайте немного отдохнём."]] },

  var SENT = [];
  SENT_DATA.forEach(function (g) {

      SENT.push({ char: it[0], pinyin: it[1], meaning: it[2], ru: it[3], chapters: [g.id], isSentence: true });

  var LEN_CHOICES = [5, 10, 15, 20, 25, 30, 40, 50, 75, 100, 0];
  var LEVEL_LABELS = { "new": "Non testé", unknown: "Pas connu du tout", half: "À moitié connu", known: "Bien connu" };
  var LEVEL_ORDER = ["new", "unknown", "half", "known"];
  var LEVEL_COLORS = { "new": "var(--border)", unknown: "var(--accent-seal)", half: "var(--accent-gold)", known: "var(--accent-jade)" };

  var PROFILE_KEY = "hanzi-quiz-data-v6";
  var OLD_PROFILE_KEY = "hanzi-quiz-data-v5";

  var currentProfile = "me";
  var store = { data: {} };

  var progress = {};       // { caractère: "unknown" | "half" | "known" }
  var chapSel = {};
  var readSel = {};
  var stats = {};
  var view = "test";
  var testType = "words";   // "words" | "read"
  var filters = { "new": true, unknown: true, half: true, known: true };
  var queue = [];
  var current = null;
  var revealed = false;
  var mode = "setup";      // "setup" | "quiz" | "result"
  var testLen = 10;        // 5, 10, 20 ou 0 (= tous)
  var testTotal = 0;
  var testResults = [];    // [{ idx, level }]

  function defaultChapSel() {
    var o = {};
    CHAPTERS.forEach(function (ch) { o[ch.id] = true; });
    return o;
  }

  function applyProfile(name) {
    var p = store.data || {};
    progress = p.progress || {};
    stats = p.stats || {};
    chapSel = defaultChapSel();
    if (p.chapSel) {
      CHAPTERS.forEach(function (ch) {
        if (typeof p.chapSel[ch.id] === "boolean") chapSel[ch.id] = p.chapSel[ch.id];
      });
    }
    testType = (p.testType === "read" || p.testType === "exo") ? p.testType : "words";
    readSel = {};
    SENT_DATA.forEach(function (g) { readSel[g.id] = true; });
    if (p.readSel) SENT_DATA.forEach(function (g) { if (typeof p.readSel[g.id] === "boolean") readSel[g.id] = p.readSel[g.id]; });
    filters = { "new": true, unknown: true, half: true, known: true };
    if (p.filters) {
      LEVEL_ORDER.forEach(function (l) {
        if (typeof p.filters[l] === "boolean") filters[l] = p.filters[l];
      });
    }
    testLen = LEN_CHOICES.indexOf(p.testLen) !== -1 ? p.testLen : 10;
    mode = "setup";
    queue = [];
    testTotal = 0;
    testResults = [];
    current = null;
    revealed = false;
  }

  function load() {
    var data = null;
    try {
      var raw = localStorage.getItem(PROFILE_KEY);
      if (raw) data = JSON.parse(raw);
      if (!data) {
        // reprise de l'ancienne version à profils : on garde le profil le plus avancé de cet appareil
        var old = JSON.parse(localStorage.getItem(OLD_PROFILE_KEY) || "null");
        if (old && old.profiles) {
          var best = null, bestN = -1;
          Object.keys(old.profiles).forEach(function (k) {
            var pr = old.profiles[k] || {};
            var n = Object.keys(pr.progress || {}).length;
            if (n > bestN) { bestN = n; best = pr; }
          });
          if (best && bestN > 0) data = best;
        }
      }
    } catch (e) { data = null; }
    store.data = data || {};
    if (store.data.progress) SENT_DATA.forEach(function (g) { g.items.forEach(function (it) { delete store.data.progress[it[0]]; }); });
    if (["fr", "ru", "en", "ko", "es", "tk"].indexOf(store.data.lang) !== -1) langPref = store.data.lang;
    applyProfile();
  }

  function save() {
    store.data = { stats: stats, progress: progress, chapSel: chapSel, readSel: readSel, testType: testType, filters: filters, testLen: testLen, lang: langPref };
    try {
      localStorage.setItem(PROFILE_KEY, JSON.stringify(store.data));
    } catch (e) { /* stockage indisponible */ }
  }

  /* ---------- Progression (globale + par chapitre) ---------- */
  function segBar(c, total) {
    var bar = document.createElement("div");

    ["known", "half", "unknown"].forEach(function (lv) {
      var seg = document.createElement("span");
      seg.style.width = (total ? c[lv] / total * 100 : 0) + "%";
      seg.style.background = LEVEL_COLORS[lv];
      bar.appendChild(seg);
    });
    return bar;
  }
  function countItems(items) {
    var c = { known: 0, half: 0, unknown: 0, "new": 0 };
    items.forEach(function (it) { c[levelOf(it)]++; });
    return c;
  }
  function renderTeam() {

    gb.className += " big";
    big.appendChild(gb);
    var legend = document.createElement("div");
    legend.className = "prog-legend";
    [["known", gc.known], ["half", gc.half], ["unknown", gc.unknown], ["new", gc["new"]]].forEach(function (x) {

      row.appendChild(det);

  function levelOf(item) { return progress[item.char] || "new"; }

  function bank() { return testType === "read" ? SENT : ALL; }
  function selMap() { return testType === "read" ? readSel : chapSel; }
  function chapList() {
    if (testType !== "read") return CHAPTERS;
    return CHAPTERS.filter(function (ch) { return SENT.some(function (x) { return x.chapters.indexOf(ch.id) !== -1; }); });
  }
  function chapCount(ch) {
    if (testType !== "read") return ch.items.length;
    return SENT.filter(function (x) { return x.chapters.indexOf(ch.id) !== -1; }).length;
  }
  function activeWords() { return ALL.filter(function (item) { return item.chapters.some(function (id) { return chapSel[id]; }); }); }
  var UNLOCK = 0.65;
  function chapMastery(ch) {
    if (!ch.items.length) return 0;
    var k = 0;
    ch.items.forEach(function (it) { if (progress[it[0]] === "known") k++; });
    return k / ch.items.length;
  }
  function chapUnlocked(ch) { return chapMastery(ch) >= UNLOCK; }
  function chapById(id) { return CHAPTERS.filter(function (c) { return c.id === id; })[0]; }
  function inSelectedChapter(item) {
    var m = selMap();
    return item.chapters.some(function (id) {
      if (!m[id]) return false;
      if (testType === "read") { var ch = chapById(id); return ch && chapUnlocked(ch); }
      return true;
    });
  }

  function activeItems() { return bank().filter(inSelectedChapter); }

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function poolIndices() {
    var idx = [];
    bank().forEach(function (item, i) {
      if (inSelectedChapter(item) && (testType === "read" || filters[levelOf(item)])) idx.push(i);
    });
    return idx;
  }

  function tally() {
    var c = { unknown: 0, half: 0, known: 0 };
    testResults.forEach(function (r) { c[r.level]++; });
    return c;
  }

      cb.disabled = locked;
      if (locked) row.style.opacity = "0.6";
      cb.addEventListener("change", function () {
        selMap()[ch.id] = cb.checked;
        save();
        renderPanel();
        renderOverview();
        updateSetupSummary();
      });
      var text = document.createElement("span");

      card.appendChild(row(T("Police des caractères chinois", "Шрифт иероглифов"), [["serif", T("宋体 Classique", "宋体 Классика"), ZH_FONTS.serif[0]], ["sans", T("黑体 Moderne", "黑体 Современный"), ZH_FONTS.sans[0]], ["brush", T("马善政 Pinceau", "马善政 Кисть"), ZH_FONTS.brush[0]]], SET.zh, function (v) { upd("zh", v); }));
      card.appendChild(row(T("Taille du texte", "Размер текста"), [["sm", T("Petite", "Малый")], ["md", T("Normale", "Обычный")], ["lg", T("Grande", "Большой")]], SET.size, function (v) { upd("size", v); }));
      card.appendChild(row(T("Animations", "Анимации"), [["on", T("Activées", "Включены")], ["off", T("Désactivées", "Выключены")]], SET.anim, function (v) { upd("anim", v); }));

      var foot = document.createElement("div"); foot.className = "set-foot";
      var cb = document.createElement("button"); cb.type = "button"; cb.className = "btn"; cb.textContent = T("Fermer", "Закрыть");
      cb.addEventListener("click", close);
      foot.appendChild(cb); card.appendChild(foot);
    }
    draw();
    document.body.appendChild(ov);
  }
  document.getElementById("settingsBtn").addEventListener("click", openSettings);

  loadSettings();
  applySettings();

  load();
  renderAll();
  [document.querySelector("header"), document.querySelector(".tabs"), document.getElementById("mainLayout")].forEach(function (el, i) { fadeIn(el, i * 90); });
})();
